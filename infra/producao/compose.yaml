# Produção em UM servidor com Docker ou Podman Compose:
#   cp infra/producao/.env.example infra/producao/.env   # e preencha (veja docs/deploy.md)
#   docker compose -f infra/producao/compose.yaml --env-file infra/producao/.env up -d --build
#
# Só o Caddy publica portas (80/443). Banco, API e front ficam na rede interna.
name: escola-do-garoto

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    # Ajustes para disco SSD e consultas curtas (ver docs/deploy.md).
    command: ['postgres', '-c', 'random_page_cost=1.1', '-c', 'jit=off']
    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: escola
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U escola -d escola']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3333'
      # O Caddy é outro container: confia no X-Forwarded-For vindo da rede interna (a API não é publicada).
      TRUSTED_PROXIES: uniquelocal
      DATABASE_URL: postgresql://escola:${POSTGRES_PASSWORD}@postgres:5432/escola
      WEB_ORIGIN: https://${DOMINIO:?defina DOMINIO}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?defina INTERNAL_API_KEY}
      FILES_DIR: /data/files
      FILES_SIGNING_SECRET: ${FILES_SIGNING_SECRET:?defina FILES_SIGNING_SECRET}
      # Mercado Pago: configurado no painel do admin (fica cifrado no banco).
      MAIL_DRIVER: smtp
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM}
    volumes:
      - files:/data/files
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3333/api/health >/dev/null || exit 1']
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://${DOMINIO}
        API_URL: http://api:3333
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3333
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SITE_URL: https://${DOMINIO}
      IMAGE_HOSTS: ${IMAGE_HOSTS:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
